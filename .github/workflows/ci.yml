name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scurt:ci .
      - name: Smoke test
        run: |
          docker run -d --rm -p 8080:8080 --name scurt scurt:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 0.5
          done
          curl -fsS -X POST http://localhost:8080/api/links \
            -H 'content-type: application/json' \
            -d '{"url":"https://example.com"}' | grep -q '"slug"'
          docker stop scurt
